[project]
name = "credit-analyst-rag"
version = "0.1.0"
description = "Credit analyst assistant combining RAG, structured financial facts, and deterministic calculations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.3",
    "ollama>=0.6.2",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.18.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers==5.1.2",
    "streamlit>=1.64.0",
    "torch>=2.8.0",
    "transformers==4.44.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_rag"]
